name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    # Enable only after confirming Code Scanning availability for this repository.
    if: ${{ vars.ENABLE_CODE_SCANNING == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      - run: make build
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:go'
